name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests của scripts
        run: python -m unittest discover -s scripts/tests
      - name: Kiểm tra nội dung
        run: scripts/validate
