name: Release

# Tạo tag dạng v2026.10.24 (thêm .2, .3 nếu phát hành nhiều lần trong ngày) để phát hành nội dung.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests của scripts
        run: python -m unittest discover -s scripts/tests
      - name: Build
        run: scripts/build --version "${GITHUB_REF_NAME}" --out dist
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Nội dung ${GITHUB_REF_NAME}" \
            --notes "Phát hành tự động từ commit ${GITHUB_SHA}." \
            --latest
